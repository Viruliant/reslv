[project]
name = "rslv"
version = "0.1.0"
description = "Recursive file dependency resolver"
requires-python = ">=3.12"
dependencies = [
"annotated-types==0.8.0",
"pydantic==2.14.3",
"pydantic-core==2.50.4",
"typing-extensions==4.16.0",
"typing-inspection==0.4.5",
]
[project.scripts]
reslv = "reslv.reslv:main"

[tool.uv.sources]
rslv = { path = ".", editable = true }
